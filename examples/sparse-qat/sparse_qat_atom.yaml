# Sparse + QAT Training Configuration for Atom LLaMA
#
# This configuration enables combined sparse fine-tuning with
# quantization-aware training on the pre-sparsified atom-llama model.
#
# Requirements:
# - Pre-sparsified base model
# - torchao >= 0.13.0

base_model: junzzhu/atomllama-33K-5x5-DigitMesh-sparse

# Fix tokenizer padding token issue
special_tokens:
  pad_token: "<SEP>"

integrations:
  - sparse_qat  # This triggers plugin load

# Load the Sparse QAT plugin
plugins:
  - axolotl.integrations.sparse_qat.SparseQATPlugin

# Sparse QAT configuration
sparse_qat:
  # Regex patterns for layers to keep sparse
  # These should match the layers that were pruned in the base model
  sparsity_targets:
    - "re:.*q_proj.weight"
    - "re:.*k_proj.weight"
    - "re:.*v_proj.weight"
    - "re:.*o_proj.weight"
    - "re:.*gate_proj.weight"
    - "re:.*up_proj.weight"
    - "re:.*down_proj.weight"

  # Target dtype for weight quantization (int4, int8, float8, nvfp4)
  weight_dtype: int8

  # Target dtype for activation quantization (optional)
  # activation_dtype: int8

  # Group size for per-group quantization
  group_size: 32

  # Whether to quantize embedding layers
  quantize_embedding: false

  # Number of steps before enabling fake quantization
  # (train normally first to stabilize, then enable quant)
  fake_quant_after_n_steps: 50

  # Save in compressed sparse format
  save_compressed: true

# Dataset configuration
# Using converted digit recognition dataset in completion format
datasets:
  - path: ./examples/sparse-qat/digit_train.jsonl
    ds_type: json
    type: completion
    field: text

quantization:
  weight_dtype: int8
  group_size: 32

# Training configuration
sequence_len: 32  # Match model's max_position_embeddings

num_epochs: 1000  # max_steps: 5000
micro_batch_size: 2
gradient_accumulation_steps: 2

learning_rate: 0.0001
optimizer: adamw_torch_fused
lr_scheduler: cosine
warmup_ratio: 0.1

bf16: true
flash_attention: false  # Tiny model doesn't need flash attention

output_dir: ./outputs/atomllama-33K-5x5-DigitMesh-sparse-int8

# Logging
logging_steps: 10
save_steps: 100
eval_steps: 100

